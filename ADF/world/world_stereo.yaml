enclosure size: { length: 100.0, width: 100.0, height: 30.0 }
lights: [light2]
cameras: [cameraL, cameraR]
environment: "./checkered_floor.yaml"
namespace: /ambf/env/
max iterations: 200
gravity: { x: 0.0, y: 0.0, z: -9.8 }
shaders:
  path: ../../ambf_shaders/rim_lighting/
  vertex: "shader.vs"
  fragment: "shader.fs"

light1:
  namespace: lights/
  name: light1
  location: { x: 0.0, y: 5.0, z: 25.0 }
  direction: { x: 0, y: 0, z: -1.0 }
  spot exponent: 0.3
  shadow quality: 0
  cutoff angle: 0.7

light2:
  namespace: lights/
  name: light2
  location: { x: 0.1, y: 0.1, z: 0.0 }
  direction: { x: 0, y: 0.0, z: -1.0 }
  attenuation: {constant: 0.8, linear: 0.8, quadratic: 0.0}
  spot exponent: 1.2 #Not used in the SRC
  shadow quality: 5
  cutoff angle: 0.9
  parent: BODY CameraFrame

light3:
  namespace: lights/
  name: light3
  location: { x: 0.0, y: 0.0, z: 55.0 }
  direction: { x: 0, y: 0, z: -1.0 }
  spot exponent: 0.3 #Not used in the SRC
  shadow quality: 0
  cutoff angle: 1.0
  parent: BODY CameraFrame


# CAMERA COMMON CONFIG
cam common configs:
  clipping plane: &cam_common_clipping_plane
    near: 0.01
    far: 100.0
  field of view: &cam_common_fov 1.5 # 55 degrees in radians 
  publish image resolution: &cam_common_pub_img_res { width: 640, height: 480 } 
  publish depth resolution: &cam_common_pub_depth_res { width: 640, height: 480 }
  # resolution: &cam_common_res { width: 640, height: 480 }

cameraL:
  namespace: stereo/
  name: left
  location: { x: -0.01, y: 0.0, z: -0.0 }
  look at: { x: 0.0, y: 0.0, z: -1.0 }
  up: { x: 0.0, y: 1.0, z: 0.0 }
  clipping plane: *cam_common_clipping_plane
  field view angle: *cam_common_fov 
  monitor: 2
  parent: BODY CameraFrame
  publish image: True
  publish image interval: 5
  publish image resolution: *cam_common_pub_img_res 
  # publish depth: True
  publish depth resolution: *cam_common_pub_depth_res
  # multipass: True # Set to True to enable shadows
  mouse control multipliers: { pan: 1.0, rotate: 1.0, scroll: 1.0, arcball: 0.1 }
  window resolution: { width: 1280, height: 1024}


cameraR:
  namespace: stereo/
  name: right
  location: { x: 0.01, y: 0.0, z: -0.0 }
  look at: { x: 0.0, y: 0.0, z: -1.0 }
  up: { x: 0.0, y: 1.0, z: 0.0 }
  clipping plane: *cam_common_clipping_plane
  field view angle: *cam_common_fov 
  monitor: 3
  parent: BODY CameraFrame
  publish image: True
  publish image interval: 5
  publish image resolution: *cam_common_pub_img_res
  # publish depth: True
  publish depth resolution: *cam_common_pub_depth_res
  visible: True
  mouse control multipliers: { pan: 1.0, rotate: 1.0, scroll: 1.0, arcball: 0.1 }
  # multipass: True
  window resolution: { width: 1280, height: 1024}

camera3:
  namespace: cameras/
  name: normal_camera
  location: { x: -30.0, y: 0.0, z: 20.0 }
  look at: { x: 0.0, y: 0.0, z: -5.0 }
  up: { x: 0.0, y: 0.0, z: 1.0 }
  clipping plane: { near: 0.1, far: 100.0 }
  field view angle: 0.8
  monitor: 2
  # parent: /ambf/env/BODY Occulus
  # orthographic view width: 6
# device: Razer Hydra

