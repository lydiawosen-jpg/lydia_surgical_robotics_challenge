bodies:
- BODY base
- BODY CameraFrame
- BODY ring_visual
- BODY wire_visual
ghost objects:
- BODY start_trigger
- BODY checkpoint1
- BODY checkpoint2
- BODY checkpoint3
- BODY checkpoint4
- BODY checkpoint5
- BODY end_trigger

soft bodies: []
joints: []
cameras:
- camera
lights: []
sensors:
- SENSOR ring_contact_sensor
- SENSOR wire_contact_sensor
actuators: []
high resolution path: high_res/
low resolution path: low_res/
ignore inter-collision: false
namespace: /ambf/env/phantom/

# Set the visibility of the ghost objects. If true, the ghost objects will be visible in the simulation. If false, they will be invisible.
visible: &ghosts_visible false
collision groups: &base_collision_groups [11, 12]
collision groups: &collision_groups [12]

